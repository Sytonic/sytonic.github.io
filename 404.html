<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 Not Found</title>
  <style>
  :root {
    color-scheme: light dark;
    --color-page-bg: light-dark(#ffffff, rgb(10, 10, 10));
    --color-page-text: light-dark(#333333, #ffffff);
    --color-container-bg: light-dark(rgba(255, 255, 255, 0.75), rgba(30, 30, 30, 0));
    --color-shadow: light-dark(rgba(204, 204, 204, 0.5), rgba(0, 0, 0, 0.5));
    --color-link-bg: light-dark(#e3f2fd, #263b50);
    --color-link-text: light-dark(#2196f3, #64b5f6);
    --color-link-hover-bg: light-dark(#bbdefb, #345574);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1rem;
    font-family: Arial, sans-serif;
    text-align: center;
    background: var(--color-page-bg);
    color: var(--color-page-text);
  }

  .container {
    width: min(100%, 500px);
    min-height: 200px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--color-container-bg);
    box-shadow: 0 0 10px var(--color-shadow);
    backdrop-filter: blur(6px) saturate(180%);
    animation: fadeIn 1s ease;
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 0.5em;
  }

  p {
    margin-bottom: 2em;
  }

  a {
    align-self: center;
    padding: 8px 14px;
    border-radius: 4px;
    background: var(--color-link-bg);
    color: var(--color-link-text);
    font-weight: bold;
    text-decoration: none;
  }

  a:hover {
    background: var(--color-link-hover-bg);
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  </style>
</head>

<body>
  <main class="container">
    <h1>404</h1>
    <p>Sorry, the page you were looking for cannot be found.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
